name: CI Quality Gate

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ts-verify:
    name: TypeScript Verification & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run TypeScript typecheck
        run: npm run typecheck

      - name: Run Vitest fast unit test suite
        run: npm run test:fast

      - name: Build Vite project
        run: npm run build

      - name: Run verification test suites
        run: npm run verify:all

  rust-verify:
    name: Rust Verification (Physics & Tauri Shell)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust stable toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust cargo artifacts
        uses: swatinem/rust-cache@v2
        with:
          workspaces: |
            crates/xband-physics
            src-tauri

      - name: Install Linux WebKitGTK & Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Run xband-physics Rust tests
        run: cargo test --manifest-path crates/xband-physics/Cargo.toml

      - name: Run src-tauri Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

  python-verify:
    name: Python Test Suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest python-multipart httpx

      - name: Run Python tests
        run: pytest -v
        env:
          PYTHONPATH: .

  browser-ux:
    name: Playwright Browser UX Gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium & system deps
        run: npx playwright install --with-deps chromium

      - name: Build Vite project
        run: npm run build

      - name: Run Playwright multi-viewport browser UX verification
        run: |
          node scripts/verify-browser-ux.mjs
          REQUIRE_PLAYWRIGHT=true npx tsx src/tests/verifyTauri01DesktopShell.ts
        env:
          CI: "true"
