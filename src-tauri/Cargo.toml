[package]
name = "tactical-xband-digital-twin"
version = "4.0.0"
description = "Cross-platform offline Tauri v2 desktop workstation for Tactical X-Band Air-to-Ground Network Digital Twin"
authors = ["Stratos Digital Twin Engineering"]
edition = "2021"

[lib]
name = "tactical_xband_digital_twin_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
http = "1"
